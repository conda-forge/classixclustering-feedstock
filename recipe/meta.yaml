{% set python_min = "3.12" %}
{% set name = "classixclustering" %}
{% set version = "1.5.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ab7816e1110b9665679ce0bf54a688f5cea50f5148a38974460057d4d5a28663
  patches:
    - force-cythonize.patch

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation"

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}

  host:
    - python >={{ python_min }},<3.13
    - pip
    - setuptools >=69
    - wheel
    - cython
    - numpy 2.3.*

  run:
    - python >={{ python_min }},<3.13
    - numpy >=2.3,<3
    - scipy >=1.11,<2.0
    - pandas >=2.1
    - matplotlib-base >=3.8
    - scikit-learn >=1.2,<2.0
    - requests

test:
  requires:
    - pip
  imports:
    - classix
  commands:
    - pip check
    - python -c "import classix; print('classix imported successfully')"

about:
  home: https://github.com/nla-group/classix
  dev_url: https://github.com/nla-group/classix
  summary: CLASSIX is a fast and explainable clustering algorithm based on sorting.
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - guettel
    - chenxinye
